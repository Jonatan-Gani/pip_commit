[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pip-commit"
version = "0.1.0"
description = "Keep requirements.txt in sync with your environment automatically on every git commit."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Jonatan Gani" }]
keywords = ["git", "pre-commit", "pip", "requirements", "freeze"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.4",
    "mypy>=1.10",
    "hypothesis>=6.100",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
pip-commit = "pip_commit.cli:main"

[project.urls]
Homepage = "https://github.com/jonatan-gani/pip_commit"
Issues = "https://github.com/jonatan-gani/pip_commit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pip_commit"]

[tool.hatch.build.targets.sdist]
include = [
    "src/pip_commit",
    "tests",
    "README.md",
    "LICENSE",
    ".pre-commit-hooks.yaml",
    "pre-commit",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/pip_commit"]
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
warn_return_any = false

# Default configuration for pip-commit itself.
# Users override this in their own pyproject.toml.
[tool.pip-commit]
output = "requirements.txt"
exclude = []
require_venv = true
prompt = true
